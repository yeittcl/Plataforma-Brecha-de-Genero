<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memoria — Brecha de Género</title>
    <style>
        :root {
            --bg: #0f172a;
            --fg: #f1f5f9;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        main {
            max-width: 720px;
            text-align: center;
        }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        p.lead { color: var(--muted); font-size: 1.125rem; line-height: 1.6; margin-bottom: 2rem; }
        .cta {
            display: inline-block;
            background: var(--accent);
            color: #0f172a;
            padding: 0.875rem 2rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .cta:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <main>
        <h1>Memoria</h1>
        <p class="lead">Plataforma de análisis de la brecha de género en la autoría de publicaciones científicas STEM.</p>
        <a class="cta" href="/dashboard/list/">Ir a dashboards</a>
    </main>
</body>
</html>
